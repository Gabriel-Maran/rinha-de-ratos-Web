spring.application.name=rinhaRatos

# Em outros ambientes, defina DB_URL, DB_USERNAME e DB_PASSWORD; sem elas, vale o banco local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rinha_de_ratos_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.show-sql=true
spring.jpa.open-in-view = false
    
